name: Clean setup and recorded-proposal execution
on:
  push:
    branches: [codex/competition-readiness, codex/submission]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-execution-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/check-evidence.cjs
      - run: node scripts/check-trials.cjs
  isolated-booking:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AF_RUNTIME_DIR: .runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build isolated fixture from public pinned inputs
        run: npm run demo:setup
      - name: Execute the recorded model proposal in a fresh fixture
        run: npm run demo:check
      - name: Verify the original source remains a negative control
        run: node scripts/demo-check.cjs --original
      - name: Export synthetic run records only
        if: always()
        run: node scripts/ci-report.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: clean-execution-evidence
          path: artifacts/clean-run/*.json
          retention-days: 60
