name: Narration check
# Transcribes the generated narration with Whisper so the spoken words can be
# compared with the script. Triggered manually or by a push containing [transcribe].
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
permissions:
  contents: write
jobs:
  transcribe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[transcribe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Whisper (CPU)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          # Python 3.12 through uv: the runner's newer default Python has no torch 2.8 wheels.
          python3 -m venv /tmp/uv && /tmp/uv/bin/pip install --quiet uv
          /tmp/uv/bin/uv venv --python 3.12 .venv
          /tmp/uv/bin/uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          /tmp/uv/bin/uv pip install --python .venv/bin/python openai-whisper==20250625
      - name: Transcribe
        run: .venv/bin/python scripts/transcribe-narration.py
      - name: Commit the transcript
        run: |
          git config user.name "accessfinish-agent"
          git config user.email "accessfinish-agent@users.noreply.github.com"
          git add media/agent-demo/transcript.json
          # A re-run on unchanged audio (e.g. a squash merge carrying [transcribe]) has nothing to commit.
          if git diff --cached --quiet; then echo "Transcript unchanged."; exit 0; fi
          git commit -m "Transcribe demo narration from ${GITHUB_SHA::7}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
